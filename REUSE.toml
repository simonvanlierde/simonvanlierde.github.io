# Who holds the copyright on each file and under which license, per the REUSE spec
# (https://reuse.software). The texts are in LICENSES/; `reuse lint` in the pre-commit hook
# checks every file.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Simon van Lierde"
SPDX-License-Identifier = "MIT"

# The Code of Conduct is the Contributor Covenant 3.0.
[[annotations]]
path = ".github/CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = "Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The vendored osifont subset, under the LGPL v3 with a font-embedding exception.
[[annotations]]
path = ["public/fonts/osifont.woff2", "public/fonts/osifont-LICENSE.txt"]
SPDX-FileCopyrightText = "The osifont authors <https://github.com/hikikomori82/osifont>"
SPDX-License-Identifier = "LicenseRef-osifont"

# My portrait, the social card that shows it, and the CV PDF stay all rights reserved.
[[annotations]]
path = ["public/portrait.jpg", "src/assets/portrait.jpg", "public/og.png", "public/files/simon-van-lierde-cv.pdf"]
SPDX-FileCopyrightText = "2026 Simon van Lierde"
SPDX-License-Identifier = "LicenseRef-all-rights-reserved"
