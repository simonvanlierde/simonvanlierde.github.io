name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck & test
        run: pnpm check

      # pnpm check already ran astro check, so skip it here.
      - name: Build
        run: pnpm exec astro build

      # Uncached: the download takes seconds, and a stale cache never self-heals.
      # No --with-deps: ubuntu-latest already has Chromium's libraries, and the flag
      # cost ~150s. Add it back if a runner image drops one.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Accessibility & e2e tests
        run: pnpm test:e2e
