name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck & test
        run: pnpm check

      # pnpm check already typechecks (astro check), so build bare — no redundant re-check.
      - name: Build
        run: pnpm exec astro build

      # axe + e2e run the built site in a real browser (contrast, keyboard,
      # hydration — things the linter can't see). Install Chromium fresh each run:
      # the headless shell is ~115 MB and downloads in seconds, so version-keyed
      # caching saves little and buys real failure modes (a poisoned cache never
      # self-heals; new PR branches miss it anyway).
      #
      # No --with-deps: the ubuntu-latest image already ships every shared library
      # Chromium needs, so the flag only spent ~150s on apt-get update plus CJK,
      # Thai and Cyrillic font packages this Latin-only site never renders. If a
      # future runner image drops a library, add the flag back.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Accessibility & e2e tests
        run: pnpm test:e2e
