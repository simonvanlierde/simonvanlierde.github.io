name: CI

on:
  # main runs too, so Codecov has a report for the main branch to show on the badge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck & test
        run: pnpm check

      # Unit tests only: pnpm check writes lcov.info; the Playwright specs below add none.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: lcov.info

      # pnpm check already ran astro check, so skip it here.
      - name: Build
        run: pnpm exec astro build

      # Uncached: the download takes seconds, and a stale cache never self-heals.
      # No --with-deps: ubuntu-latest already has Chromium's libraries, and the flag
      # cost ~150s. Add it back if a runner image drops one.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Accessibility & e2e tests
        run: pnpm test:e2e

      - name: Upload build for the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Uploads a PR's build as a version of the preview Worker in wrangler.jsonc,
  # at a stable pr-<number> URL that the PR shows as its deployment. Fork PRs
  # never get the token, so they skip with a notice, as does a missing secret.
  # The secrets live in the `preview` environment.
  preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Check credentials
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ] || [ -z "$TOKEN" ]; then
            echo "::notice::Preview skipped: fork PR or CLOUDFLARE_API_TOKEN not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26
          install: false

      - if: steps.gate.outputs.run == 'true'
        name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Search engines should index simonvanlierde.com, not the preview copies.
      - if: steps.gate.outputs.run == 'true'
        name: Keep previews out of search results
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers

      # wrangler through dlx, so the site's own install stays without it.
      - if: steps.gate.outputs.run == 'true'
        name: Upload Worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # pipefail: the default shell takes the pipe's status from tee, so a
        # refused upload would otherwise pass.
        run: |
          set -o pipefail
          pnpm dlx wrangler@4.150.0 versions upload --preview-alias "pr-$PR" --message "PR $PR at $SHA" | tee upload.log
          url=$(grep 'Version Preview Alias URL:' upload.log | grep -Eo 'https://[^ ]+' || true)
          if [ -z "$url" ]; then
            echo "::error::Version uploaded, but wrangler printed no alias URL. Check preview_urls and workers_dev in wrangler.jsonc."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
