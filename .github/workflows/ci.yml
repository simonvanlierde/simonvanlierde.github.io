name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck & test
        run: pnpm check

      # pnpm check already ran astro check, so skip it here.
      - name: Build
        run: pnpm exec astro build

      # Uncached: the download takes seconds, and a stale cache never self-heals.
      # No --with-deps: ubuntu-latest already has Chromium's libraries, and the flag
      # cost ~150s. Add it back if a runner image drops one.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Accessibility & e2e tests
        run: pnpm test:e2e

  # Merges a Dependabot PR once `check` passes, unless a bump is a new major
  # version. A grouped PR reports its biggest bump, so one major holds the whole
  # group back for a manual look.
  dependabot-merge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # merge
      pull-requests: write
      actions: write # dispatch deploy.yml
    steps:
      - name: Read the update type
        id: meta
        uses: dependabot/fetch-metadata@v3

      # A merge made with the default GITHUB_TOKEN starts no push workflows, so
      # dispatch the deploy, as refresh-data.yml does.
      - name: Merge and deploy
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |-
          gh pr merge "$PR" --squash
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
