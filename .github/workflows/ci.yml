name: CI

on:
  # main runs too, so Codecov has a report for the main branch to show on the badge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck & test
        run: pnpm check

      # Unit tests only: pnpm check writes lcov.info; the Playwright specs below add none.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: lcov.info

      # pnpm check already ran astro check, so skip it here.
      - name: Build
        run: pnpm exec astro build

      # Uncached: the download takes seconds, and a stale cache never self-heals.
      # No --with-deps: ubuntu-latest already has Chromium's libraries, and the flag
      # cost ~150s. Add it back if a runner image drops one.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Accessibility & e2e tests
        run: pnpm test:e2e
