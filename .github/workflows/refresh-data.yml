name: Refresh site data

# Commits fresh R9lab figures to src/data/stats.json and fresh evidence files
# (scripts/fetch-evidence.mjs), then dispatches deploy.yml:
# a push with the default GITHUB_TOKEN triggers no other workflow.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: write # commit the refreshed snapshot
      actions: write # dispatch deploy.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] the job pushes the refreshed snapshot with this credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Both fetch scripts use only Node built-ins, so no dependency install.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26
          install: false

      - name: Fetch stats
        run: pnpm fetch:stats

      # Upstream PRs, Zenodo DOIs and OpenAlex works. The GitHub search runs with this token.
      - name: Fetch evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm fetch:evidence

      - name: Commit refreshed snapshots and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: src/data/stats.json src/data/upstream.json src/data/dois.json src/data/openalex.json
        # fetched_at changes on every successful run, so this commits weekly. The
        # drift check reads that stamp to see that the refresh still works.
        run: |-
          # shellcheck disable=SC2086 # FILES is a list of paths
          if git diff --quiet -- $FILES; then
            echo "No change in $FILES."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $FILES
          git commit -m "chore: refresh site data"
          # Rebase onto commits that landed while this job ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
