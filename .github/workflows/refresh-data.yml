name: Refresh RELab stats

# Commits fresh RELab figures to src/data/stats.json, then dispatches deploy.yml:
# a push with the default GITHUB_TOKEN triggers no other workflow.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed snapshot
  actions: write # dispatch deploy.yml

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # fetch-stats uses only Node built-ins, so no dependency install.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          install: false

      - name: Fetch stats
        run: pnpm fetch:stats

      - name: Commit refreshed snapshot and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          if git diff --quiet -- src/data/stats.json; then
            echo "No change in src/data/stats.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git commit -m "chore: refresh RELab stats"
          # Rebase onto commits that landed while this job ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
