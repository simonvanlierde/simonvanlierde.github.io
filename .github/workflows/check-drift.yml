name: Check page drift

# Keeps one open issue listing what scripts/check-drift.sh finds, and closes it
# once the homepage and profile README have caught up.

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after refresh-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # scripts/evidence-drift.mjs imports TypeScript, which needs Node 26; it uses no dependencies.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@26
          install: false

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Homepage or profile README is behind the repos
        run: |-
          report=$(scripts/check-drift.sh)
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n1)
          if [ -z "$report" ]; then
            [ -n "$issue" ] && gh issue close "$issue" --comment "Nothing behind any more."
            exit 0
          fi
          body="$report
          Repos to leave off both pages go in \`.github/drift-ignore\`, one name per line.
          Merged PRs to leave off go in \`leftOut\` in \`src/data/upstream.ts\`."
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
