version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # `astro check` (pnpm typecheck, pnpm build) drives TypeScript's
      # programmatic API, which the native compiler in 7.0 does not ship:
      # https://github.com/withastro/roadmap/discussions/1321
      # Drop this once 7.1 restores it; re-check before taking the bump.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      "npm deps":
        patterns:
          - "*"
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      "github actions":
        patterns:
          - "*"
