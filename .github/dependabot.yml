version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # `astro check` (pnpm typecheck, pnpm build) drives TypeScript's
      # programmatic API, which the native compiler in 7.x does not ship yet:
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      "npm deps":
        patterns:
          - "*"
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      "github actions":
        patterns:
          - "*"
