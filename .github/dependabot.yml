version: 2

# One monthly pull request covers both ecosystems.
multi-ecosystem-groups:
  deps:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "deps"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # `astro check` (pnpm typecheck, pnpm build) drives TypeScript's
      # programmatic API, which the native compiler in 7.0 does not ship:
      # https://github.com/withastro/roadmap/discussions/1321
      # Drop this once 7.1 restores it; re-check before taking the bump.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      # Advisories arrive outside the monthly window and ignore the group above,
      # so without this each one opens its own pull request and its own CI run.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "deps"
    patterns: ["*"]
    cooldown:
      default-days: 7
