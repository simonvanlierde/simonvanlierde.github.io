version: 2

# One monthly pull request covers both ecosystems.
multi-ecosystem-groups:
  deps:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "deps"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # `astro check` needs TypeScript's programmatic API, which 7.0 lacks.
      # Drop once 7.1 restores it: https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      # Security updates skip the monthly group; batch them into one pull request.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "deps"
    patterns: ["*"]
    cooldown:
      default-days: 7
