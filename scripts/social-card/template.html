<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: osifont; src: url("osifont.woff2") format("woff2"); }
  /* Light-theme values of the site tokens in src/styles/global.css, under the same names. */
  :root {
    --bg: oklch(97.5% 0.005 95); --text: oklch(23% 0.015 255); --text-muted: oklch(43% 0.02 255);
    --border: oklch(80% 0.012 255); --border-strong: oklch(32% 0.02 255); --accent: oklch(42% 0.13 262);
    --grid: color-mix(in oklch, var(--border) 40%, var(--bg));
    --m: 24px; --frame: 3px; --line: 2px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--bg); color: var(--text);
         font-family: osifont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: var(--m); border: var(--frame) solid var(--border-strong); }
  /* Everything that carries meaning sits in x 300-915, inside the centred 630 px square a preview may crop to; the visual starts at 885 and may be cut. */
  .text { position: absolute; left: 276px; width: 564px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  /* The mark shares the name's centre-square column; it never goes in the visual panel. */
  .mark { display: block; width: 96px; height: 96px; margin-bottom: 24px; }
  #name { font-size: 120px; line-height: 1; letter-spacing: .01em; overflow-wrap: normal; }
  #line { font-size: 40px; line-height: 1.25; margin-top: 28px; }
  .domain { font-size: 32px; line-height: 1; margin-top: 36px; white-space: nowrap; color: var(--accent); }
  .domain::before { content: ""; display: block; width: 96px; margin-bottom: 28px; border-top: var(--line) solid var(--border-strong); }
  /* The proof: one app screen, big, cropped to its telling part, outside the square crop. */
  .visual { position: absolute; top: 0; bottom: 0; right: 0; width: 288px; border-left: var(--frame) solid var(--border-strong);
            background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / var(--m) var(--m),
                        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / var(--m) var(--m), var(--bg); }
  .visual img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus); }
  .visual.contain img { width: 240px; height: 240px; position: absolute; left: 21px; top: 50%; translate: 0 -50%; object-fit: contain; }
</style>
<div class="frame">
  <div class="text">
    {{mark}}
    <div id="name">{{name}}</div>
    <p id="line">{{line}}</p>
    <div class="domain">{{domain}}</div>
  </div>
  {{visual}}
</div>
<script>"use strict";
  // shot.mjs calls this once the font has loaded, since the fallback font measures differently.
  window.fit = () => {
    const n = document.getElementById("name"); let s = 120;
    while ((n.scrollHeight > s * 2.1 || n.scrollWidth > n.clientWidth) && s > 36) { s -= 2; n.style.fontSize = `${s}px`; }
    const l = document.getElementById("line"); let t = 40;
    while (l.scrollHeight > t * 1.25 * 3.1 && t > 36) { t -= 1; l.style.fontSize = `${t}px`; }
  };
</script>
