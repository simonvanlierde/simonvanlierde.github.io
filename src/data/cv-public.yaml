profile: >-
  I'm a full-stack research software engineer with three years of professional experience in software, data, and solution architecture, now halfway through a PhD in Industrial Ecology at CML, Leiden University. I lead the development of R9lab, a platform that records what products are made of, and I own it end to end. I also build dashboards and interactive visualizations so that people outside the field can read the research. My code and data are open and follow the FAIR principles (findable, accessible, interoperable, reusable).
experience:
  - organization: CML, Leiden University
    role: PhD Researcher in Industrial Ecology
    start: 2024-04
    end: present
    highlights:
      - "Lead developer of R9lab, responsible for the whole software lifecycle: a FastAPI/PostgreSQL backend with OAuth and Alembic migrations, React/TypeScript and Expo front-ends, CI/CD, Cloudflare networking, restic backups, and security hardening guided by OWASP ASVS."
      - Ran two data-collection workshops (135 participants) and deployed the platform in a lab. By October 2026 it held 94 products, 1,779 components, and 4,455 images.
      - Designed and deployed a central observability stack for CML's research software (OpenTelemetry, Grafana, OpenTofu). R9lab reports to it today.
      - Built a Raspberry Pi camera plugin that captures images automatically. It has an OpenAPI spec and is released on PyPI.
  - organization: Nationale Milieudatabase (Dutch Environmental Database)
    role: Data Manager
    start: 2023-09
    end: 2024-04
    highlights:
      - Managed the environmental databases behind sustainability calculations for the Dutch construction sector. Improved their data structure, consistency, and validation, and advised on software implementation.
      - Brought the national environmental databases in line with open data standards (EU LCDN, PEF), working with policymakers, developers, and industry.
  - organization: Metabolic
    role: Solution Architect & Product Manager
    start: 2022-08
    end: 2023-09
    highlights:
      - Designed tools for LCA (life-cycle assessment) and sustainability reporting. Advised the division's projects on how to apply LCA, EEIOA (environmentally extended input-output analysis), and MFA (material flow analysis).
      - Product owner and domain expert for automated sustainability-reporting tools (FastAPI, Vue) that replaced static Excel models with REST APIs and web applications.
  - organization: Metabolic
    role: Consultant & Data Analyst, Sustainable Industries
    start: 2021-02
    end: 2022-08
    highlights:
      - Built environmental-impact models (LCA, MFA) in Python for sustainability consulting projects, with clients in industry, NGOs, and government.
projects:
  - name: R9lab
    url: https://github.com/CMLPlatform/r9lab
    summary: Open-source platform that records what products are made of by taking them apart, and collects the photos that computer-vision research needs.
  - name: Open-source contributions
    highlights:
      - "lca_algebraic: fixed sampling, method lookup and a time-zone cache bug; halved parameter expansion (0.76 s to 0.40 s) and made Sobol analysis about 20× faster without second-order indices (3.13 s to 0.16 s)."
      - "Brightway and pymrio: fixed wrong LCA scores, cleared two security advisories, made importing Brightway about 0.3 s faster, and sped up pymrio's account calculation 26× (6.1 s to 0.23 s)."
      - "flodym: stopped lifetime extension overwriting model parameters, and made it 9× faster (0.83 s to 0.092 s)."
      - "premise and Activity Browser: fixed unreported scenario bugs in premise, and parameter, scenario-file and Monte Carlo bugs in Activity Browser."
      - "Also merged: CodeMeta, Boavizta, SchemaStore, pyOpenSci, wanderer and fastapi-mail (30 pull requests in all)."
  - name: jsonvet
    url: https://github.com/simonvanlierde/jsonvet
    summary: "Pre-commit hook and Rust library that checks JSON, JSONC, JSON5 and three other dialects, released on PyPI and crates.io. Matches the Python original on 40,228 test runs, survived a billion fuzzing inputs, up to 1,395× faster."
  - name: Public web apps
    url: https://simonvanlierde.com/
    summary: "credit-matrix, a CRediT authorship-statement tool with a Zenodo DOI, and four personal web apps, among them a multiplayer game whose one-CPU server holds about 200 rooms of 6 players under load."
  - name: RaMa-Scene explorer
    url: https://simonvanlierde.com/ramascene-explorer/
    summary: "Map of where a country's consumption causes emissions, jobs and metal-ore extraction, over a baseline and 153 RaMa-Scene scenarios on EXIOBASE (Svelte, D3). It loads under 1 MB of a 51.5 MB Parquet file by range request. Zenodo DOI."
  - name: Computer-vision taxonomy visual
    url: https://simonvanlierde.com/cv-ie-taxonomy/
    summary: "Interactive React/SVG map of computer vision in industrial ecology, drawn as an exploded teardown, for an upcoming paper."
  - name: MSc-thesis cooling dashboard
    url: https://simonvanlierde.com/msc-thesis-ie
    summary: "A dashboard of cooling demand in The Hague and its life-cycle impacts, from my MSc thesis (Nivo, MapLibre)."
