    degree: MSc Industrial Ecology
    start: 2018
    end: 2023
    details: Joint degree; specialization in environmental modeling, LCA, and GIS. Thesis used Python geoscripting to model environmental impacts of space cooling in The Hague.
  - institution: Radboud University
    degree: BSc Physics & Astronomy
    start: 2014
    end: 2018
    details: Focus on mathematics, theoretical physics, and programming; exchange semester at the National University of Singapore.
