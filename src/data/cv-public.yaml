profile: >-
  I'm a full-stack research software engineer with three years of professional experience in software, data, and solution architecture. I'm now halfway through a PhD in Industrial Ecology at CML, Leiden University. I build open-source tools and data infrastructure that turn environmental research into software people can rely on and find easy to use. As lead developer of R9lab, I own the platform end to end. I also build dashboards and interactive visualizations that make research readable for people outside the field. I work in the open throughout and follow the FAIR principles (findable, accessible, interoperable, reusable).
experience:
  - organization: CML, Leiden University
    role: PhD Researcher in Industrial Ecology
    start: 2024-04
    end: present
    highlights:
      - "Lead developer of R9lab, responsible for the whole software lifecycle: a FastAPI/PostgreSQL backend with OAuth and Alembic migrations, React/TypeScript and Expo front-ends, CI/CD, Cloudflare networking, restic backups, and security hardening guided by OWASP ASVS."
      - Ran two data-collection workshops (135 participants) and deployed the platform in a lab. The pilot recorded 78 products, 1,331 components, and 3,610 images.
      - Designed and deployed a central observability stack that CML's research software shares (OpenTelemetry, Grafana, infrastructure managed with OpenTofu).
      - Built a Raspberry Pi camera plugin that captures images automatically. It has an OpenAPI spec and is released on PyPI.
  - organization: Nationale Milieudatabase (Dutch Environmental Database)
    role: Data Manager
    start: 2023-09
    end: 2024-04
    highlights:
      - Managed the environmental databases behind sustainability calculations for the Dutch construction sector. Improved their data structure, consistency, and validation, and advised on software implementation.
      - Brought the national environmental databases in line with open data standards (EU LCDN, PEF), working with policymakers, developers, and industry.
  - organization: Metabolic
    role: Solution Architect & Product Manager
    start: 2022-08
    end: 2023-09
    highlights:
      - Shaped the technical design of tools for LCA (life-cycle assessment) and sustainability reporting, and was their product owner. Guided how the division's projects applied LCA, EEIOA (environmentally extended input-output analysis), and MFA (material flow analysis).
      - Product owner and domain expert for automated sustainability-reporting tools (FastAPI, Vue). They replaced static Excel models with REST APIs and web applications.
  - organization: Metabolic
    role: Consultant & Data Analyst, Sustainable Industries
    start: 2021-02
    end: 2022-08
    highlights:
      - Built environmental-impact models (LCA, MFA) in Python for sustainability consulting projects, with clients in industry, NGOs, and government.
