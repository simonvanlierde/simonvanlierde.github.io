minimumReleaseAge: 10080 # minutes (7 days), as in renovate.json5; blocks installing very fresh (often compromised) releases

allowBuilds:
  esbuild: true
  lefthook: false
  sharp: true
  # wrangler only uploads previews; the local Workers runtime it would set up is never run.
  workerd: false
minimumReleaseAgeExclude:
  # Renovate security update: astro@7.4.7
  - astro@7.4.7
